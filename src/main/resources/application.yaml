spring:
  application:
    name: demo

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://postgres:5432/service_db}
    username: ${DB_USERNAME:dbuser}
    password: ${DB_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost/auth/realms/oAuth}
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost/auth/realms/oAuth}
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:myclient}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:jeWE38sfUCQJhplYyeJ7IwcMk8P27fVh}
            scope: openid

app:
  keycloak:
    client-id: ${KEYCLOAK_CLIENT_ID:myclient}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:jeWE38sfUCQJhplYyeJ7IwcMk8P27fVh}
    out-uri: ${KEYCLOAK_ISSUER_URI:http://localhost/auth/realms/oAuth}
    docker-uri: ${DOCKER_KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/oAuth}
    backend-callback-uri: ${BACKEND_CALLBACK_URI:http://localhost/api/v1/auth/callback}
    frontend-redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost/callback}

keycloak:
  auth-uri: ${KEYCLOAK_AUTH_URI:http://keycloak:8080/realms/oAuth/protocol/openid-connect/auth}
  token-uri: ${KEYCLOAK_TOKEN_URI:http://keycloak:8080/realms/oAuth/protocol/openid-connect/token}
  logout-uri: ${KEYCLOAK_LOGOUT_URI:http://keycloak:8080/realms/oAuth/protocol/openid-connect/logout}
  client-id: ${KEYCLOAK_CLIENT_ID:myclient}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:mysecret}

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method      # сортировка по HTTP методу (GET, POST...)
    tagsSorter: alpha             # сортировка тегов по алфавиту
    tryItOutEnabled: true         # кнопка "Try it out" активна по умолчанию
    filter: true                  # поле поиска по API
    doc-expansion: none           # сворачиваем все разделы при загрузке
    display-request-duration: true # показывать длительность запроса
  show-actuator: false
  writer-with-default-prettify: true

server:
  port: 8085
